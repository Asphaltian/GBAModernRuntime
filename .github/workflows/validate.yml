name: validate
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SLANG_VERSION: '2026.8'
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        type: [Debug, Release]
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: ${{ matrix.os }} (${{ matrix.type }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Slang
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) platform=linux-x86_64 ;;
            Windows) platform=windows-x86_64 ;;
            macOS) platform=macos-aarch64 ;;
          esac
          curl -fsSL "https://github.com/shader-slang/slang/releases/download/v${{ env.SLANG_VERSION }}/slang-${{ env.SLANG_VERSION }}-$platform.zip" -o slang.zip
          unzip -q slang.zip -d "$RUNNER_TEMP/slang"
          echo "$RUNNER_TEMP/slang/bin" >> "$GITHUB_PATH"
      - name: Build
        run: dotnet build -c ${{ matrix.type }}
      - name: Test
        run: dotnet test -c ${{ matrix.type }} --no-build
